[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulpkg"
version = "0.1.0"
description = "Package manager for the Vulpin programming language"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "dragprog", email = "stefan.dragan95@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
    "packaging>=21.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "tomli-w>=1.0.0",
]

[project.scripts]
vulp = "vulp.cli:main"

[project.urls]
Homepage = "https://github.com/dragprog/vulp"
